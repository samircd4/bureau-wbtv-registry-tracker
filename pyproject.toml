[project]
name = "bureau-wbtv-registry-tracker"
version = "0.1.0"
description = "Fetch and monitor interpreter and translator registry data from the Bureau Wbtv public portal."
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
